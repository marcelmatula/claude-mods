name: Check mods

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The function-hooks plugin API is early access: pin the version the mods are tested on.
      CLAUDE_CODE_VERSION: 2.1.294
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Claude Code
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Validate the marketplace
        run: claude plugin validate .

      # A mod is a folder with .claude-plugin/plugin.json. Every mod is checked even
      # when an earlier one fails; a mod without *.test.ts(x) fails `plugin test`.
      - name: Validate and test each mod
        run: |
          status=0
          found=0
          for manifest in */.claude-plugin/plugin.json; do
            [ -e "$manifest" ] || continue
            mod="${manifest%%/*}"
            found=$((found + 1))
            echo "::group::$mod"
            (cd "$mod" && claude plugin validate .) || { echo "::error title=$mod::claude plugin validate failed"; status=1; }
            (cd "$mod" && claude plugin test .) || { echo "::error title=$mod::claude plugin test failed"; status=1; }
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No mod folders (*/.claude-plugin/plugin.json) found"
            exit 1
          fi
          exit "$status"
